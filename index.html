<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title></title>
    <link href="./style.css" rel="stylesheet">
  </head>
  <body>
    <div class="scrollable-content" id="scrollable-content">
      <header>
        <div id="logo">
          <img src="assets/logo-ciclofort-com-texto-sem-fundo.png"></img>
        </div>
      </header>
      <div id="product-list"></div>
      <div id="not-found" style="display: none">Não há nada aqui :(</div>
    </div>
    <footer id="footer">
      <div class="total-price">
        <span>Total: </span>
        <span id="total-price">R$ 0,00</span>
      </div>
      <button id="send-btn" disabled="true" onclick="sendMessage()">
        Enviar Pedido para o Whatsapp
      </button>
    </footer>
    <div id="image-modal" class="modal" onclick="closeZoom()">
      <span class="close-modal">&times;</span>
      <img class="modal-content" id="img-expanded">
    </div>
  </body>
  <script src="dist/script.bcb1cdd.js"></script>
</html>
